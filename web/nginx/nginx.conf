# web/nginx.conf
server {
    listen 80;
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://gateway:8080;
    }
    location /api/chat {
        proxy_pass http://gateway:8080;
        proxy_buffering off;  # 禁用缓冲
    }
}
